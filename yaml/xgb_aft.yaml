# Base configurations
base:
  device: auto
  seed: 42
  experiment_name: xgb_aft_testing
  test_size: 0.3

# Imputer pipeline configuration
imputer:

  data:
    T_max: 60
    corrupt_rate: 0.2

  train:
    # features:
    epochs: 30
    patience: 5
    batch_size: 32
    shuffle: true
    lr: 1e-3
    weight_decay: 0.05
    # Optuna
    n_trials: 30
    # Optuna search space
    batch_size_choices: [32, 64, 96, 128]
    hidden_size_choices: [32, 64, 96, 128]
    dropout_min: 0.01
    dropout_max: 0.2
    lr_min: 3e-4
    lr_max: 3e-3
    weight_decay_min: 1e-6
    weight_decay_max: 1e-2

  model:
    hidden_size: 64
    n_layers: 2
    dropout: 0.1

# Survival pipeline configuration
survival:
  
  train:
    n_splits: 3
    shuffle: true
    n_trials: 3
    direction: maximize

  model:
    model_name: xgb_aft
    verbosity: 0
    aft_loss_distribution: "logistic"
    num_boost_round: 450
    early_stopping_rounds: 8

    # Optuna search space
    eta_min: 0.01
    eta_max: 0.1

    max_depth_min: 2
    max_depth_max: 4

    subsample_min: 0.5
    subsample_max: 0.9

    colsample_bytree_min: 0.5
    colsample_bytree_max: 0.9

    lambda_min: 4.0
    lambda_max: 8.0

    alpha_min: 4.0
    alpha_max: 8.0

    gamma_min: 2.0
    gamma_max: 8.0

    min_child_weight_min: 40
    min_child_weight_max: 60